name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install the test runner only (the package itself has no dependencies)
        run: python -m pip install --upgrade pytest
      - name: unit tests
        run: python -m pytest -q
      - name: the clean batch must be admitted end to end (exit 0)
        run: PYTHONPATH=src python -m model_error_translator.cli check --manifest fixtures/manifest.json --requests fixtures/requests_clean.jsonl
      - name: the seeded-bad batch must refuse and hold (exit 2)
        run: |
          set +e
          PYTHONPATH=src python -m model_error_translator.cli check --manifest fixtures/manifest.json --requests fixtures/requests_bad.jsonl
          test $? -eq 2
      - name: the failure payloads must hold on the shape the rules do not recognise (exit 2)
        run: |
          set +e
          PYTHONPATH=src python -m model_error_translator.cli explain --failures fixtures/failures.jsonl
          test $? -eq 2
